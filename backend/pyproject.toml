[project]
name = "ai-hr-backend"
version = "0.1.0"
description = "AI-HR 后端服务：FastAPI + SQLite，支撑前端现有契约"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "httpx>=0.27",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
]

[tool.uv]
# 作为应用（非可发布库）管理，依赖直接装在 .venv
package = false
